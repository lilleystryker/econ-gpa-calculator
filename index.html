<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCSB Economics Pre-Major GPA Calculator</title>
<style>
  :root { --navy:#003660; --gold:#FEBC11; --bg:#f4f6f8; }
  * { box-sizing:border-box; }
  body { background:var(--bg); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         color:#1d2733; margin:0; padding:0; }
  .wrap { max-width:760px; margin:24px auto; background:#fff; border-radius:14px;
          box-shadow:0 6px 24px rgba(0,0,0,.08); overflow:hidden; }
  .topbar { background:var(--navy); color:#fff; padding:20px 28px; display:flex; align-items:center; gap:18px; }
  .seal { flex:0 0 auto; width:74px; height:74px; border-radius:50%; background:#fff;
          padding:5px; box-shadow:0 2px 8px rgba(0,0,0,.25); box-sizing:border-box; }
  .seal img { width:100%; height:100%; display:block; }
  .topbar .titles { min-width:0; }
  .topbar h2 { margin:0; font-size:22px; }
  .topbar .sub { opacity:.85; font-size:14px; margin-top:4px; }
  .gold-rule { height:5px; background:var(--gold); }
  .content { padding:26px 28px 30px; }
  .steps { display:flex; gap:6px; margin-bottom:22px; }
  .step { flex:1; height:6px; border-radius:3px; background:#dfe4ea; }
  .step.active { background:var(--gold); }
  .step.done { background:var(--navy); }
  .qlabel { font-weight:600; font-size:16px; margin:18px 0 8px; }
  .course-row { display:flex; align-items:center; justify-content:space-between;
                gap:12px; padding:10px 0; border-bottom:1px solid #eef1f4; }
  .course-name { font-weight:600; min-width:90px; }
  .hint { color:#5a6b7b; font-size:13px; }
  select { min-width:230px; padding:8px 10px; border:1px solid #c7d0d9; border-radius:8px;
           font-size:14px; background:#fff; }
  select.narrow { min-width:130px; }
  label.opt { display:block; padding:8px 0; }
  .btn-nav { background:var(--navy); color:#fff; border:none; padding:10px 22px;
             border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; }
  .btn-nav:hover { background:#00254a; }
  .btn-back { background:#e6eaee; color:#1d2733; border:none; padding:10px 22px;
              border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; }
  .navrow { display:flex; justify-content:space-between; margin-top:26px; }
  .radio { padding:10px 12px; border:1px solid #dfe4ea; border-radius:10px; margin:8px 0;
           cursor:pointer; display:block; }
  .radio:hover { border-color:var(--navy); }
  .radio input { margin-right:10px; }
  .result-card { border-radius:12px; padding:20px 22px; margin-bottom:16px; }
  .ok   { background:#e7f6ec; border:1px solid #bfe6cd; }
  .warn { background:#fff4e0; border:1px solid #ffe1a8; }
  .bad  { background:#fde8e8; border:1px solid #f6c6c6; }
  .info { background:#eef4fb; border:1px solid #cfe0f3; }
  .bignum { font-size:40px; font-weight:800; color:var(--navy); line-height:1; }
  .pill { display:inline-block; background:var(--navy); color:#fff; border-radius:999px;
          padding:4px 14px; font-weight:700; font-size:18px; }
  .muted { color:#5a6b7b; font-size:13px; }
  hr { border:none; border-top:1px solid #eef1f4; margin:18px 0; }
  ul { margin:8px 0 0 18px; padding:0; }
  li { margin:4px 0; }
</style>
</head>

<script>
// ===================== Calculation logic (mirror of gpa_logic.R) =============
const REQ = 2.85, MIN_PASS = 2.0;
const GRADE_POINTS = {"A+":4.0,"A":4.0,"A-":3.7,"B+":3.3,"B":3.0,"B-":2.7,
  "C+":2.3,"C":2.0,"C-":1.7,"D+":1.3,"D":1.0,"D-":0.7,"F":0.0};
const GRADE_ORDER = ["F","D-","D","D+","C-","C","C+","B-","B","B+","A-","A"];
const LETTERS = Object.keys(GRADE_POINTS);
const COUNTS = ["ucsb","uc_other"];
const REMAINING = ["in_progress","planned"];

const STATUS_CHOICES = [
  ["ucsb","Completed at UCSB"],
  ["uc_other","Completed at another UC campus"],
  ["non_uc","Completed at a non-UC school (transfer/AP)"],
  ["in_progress","Currently in progress"],
  ["planned","Not yet taken"]
];

function premajorCourses(major){
  if (major === "econ")
    return [["ECON 1",5,false],["ECON 2",5,false],["ECON 10A",5,true]];
  return [["ECON 1",5,false],["ECON 2",5,false],["ECON 3A",5,false],
          ["ECON 3B",5,false],["ECON 10A",5,true]];
}
function minLetter(thr){
  if (thr === null || isNaN(thr)) return null;
  if (thr <= 0) return GRADE_ORDER[0];
  if (thr > 4.0) return null;
  for (const g of GRADE_ORDER) if (GRADE_POINTS[g] + 1e-9 >= thr) return g;
  return null;
}
function wgpa(units, pts){
  const tu = units.reduce((a,b)=>a+b,0);
  if (tu === 0) return null;
  let s=0; for (let i=0;i<units.length;i++) s += units[i]*pts[i];
  return s/tu;
}
function evaluate(major, entries, econ5){
  const courses = premajorCourses(major);
  const warnings = [], notes = [];
  let cu=[], cp=[], remU=[], remCodes=[], compCodes=[], nonuc=[], belowC=[];
  for (const [code,units,ucsbOnly] of courses){
    const e = entries[code] || {status:"planned"};
    const st = e.status;
    if (ucsbOnly && (st==="uc_other" || st==="non_uc"))
      warnings.push(code+" must be completed at UCSB. A grade from another school cannot satisfy this requirement.");
    if (COUNTS.includes(st)){
      const g = e.grade;
      if (g && GRADE_POINTS.hasOwnProperty(g)){
        cu.push(units); cp.push(GRADE_POINTS[g]); compCodes.push(code);
        if (GRADE_POINTS[g] < MIN_PASS) belowC.push(code);
      } else { remU.push(units); remCodes.push(code); }
    } else if (REMAINING.includes(st)){ remU.push(units); remCodes.push(code); }
    else if (st==="non_uc"){ nonuc.push(code); }
  }
  const current = wgpa(cu, cp);
  const compU = cu.reduce((a,b)=>a+b,0);
  const compP = cu.reduce((s,u,i)=>s+u*cp[i],0);
  const rem = remU.reduce((a,b)=>a+b,0);

  // Econ 5 supplement on completed grades
  let eff = current, e5used = false;
  if (econ5 && GRADE_POINTS.hasOwnProperty(econ5.grade) && econ5.first){
    const cand = wgpa(cu.concat([5]), cp.concat([GRADE_POINTS[econ5.grade]]));
    if (current !== null && cand > current-1e-9 && current < REQ && cand >= REQ){
      e5used = true; eff = cand;
    }
  } else if (econ5 && GRADE_POINTS.hasOwnProperty(econ5.grade) && econ5.first===false){
    notes.push("Only the FIRST attempt of ECON 5 may supplement the pre-major GPA; a repeat ECON 5 grade cannot be used.");
  }

  let reqAvg=null, reqLetter=null, proj=null, reqAvgE5=null, reqLetterE5=null;
  if (rem > 0){
    const tu = compU + rem;
    reqAvg = (REQ*tu - compP)/rem;
    reqLetter = minLetter(reqAvg);
    if (reqLetter) proj = (compP + GRADE_POINTS[reqLetter]*rem)/tu;
    if (econ5 && GRADE_POINTS.hasOwnProperty(econ5.grade) && econ5.first!==false){
      const e5p = GRADE_POINTS[econ5.grade];
      const tu2 = compU + 5 + rem;
      const cand = (REQ*tu2 - compP - e5p*5)/rem;
      if (cand < reqAvg - 1e-9){ reqAvgE5 = cand; reqLetterE5 = minLetter(cand); }
    }
  }

  const met = eff !== null && eff >= REQ;
  if (belowC.length) warnings.push("Grade below C in: "+belowC.join(", ")+
    ". A pre-major course must be passed with a C or higher; this course would need to be retaken.");
  if (nonuc.length) notes.push("Non-UC credit (excluded from the GPA) for: "+nonuc.join(", ")+
    ". You receive course credit, but the 2.85 must be met with your UC-taken pre-major courses.");
  if (e5used) notes.push("Your ECON 5 grade was applied to help you reach 2.85. Confirm eligibility with the Economics Undergraduate Advising Office.");

  return {current, eff, met, metOnlyE5: e5used && met, hasRemaining: rem>0,
    remCodes, compCodes, reqAvg, reqLetter, reqAvgE5, reqLetterE5, proj,
    impossible: rem>0 && reqLetter===null && reqAvg!==null && reqAvg>4.0,
    belowC, nonuc, warnings, notes};
}

// ===================== Wizard state & UI =====================================
const state = { page:1, major:"econ", statuses:{}, grades:{}, econ5:null, result:null };
const fmt = x => (x===null||isNaN(x)) ? "–" : x.toFixed(3);

function renderSteps(){
  const labels = ["Major","Courses","Grades","Results"];
  document.getElementById("steps").innerHTML = labels.map((_,i)=>{
    let cls="step"; if (i+1<state.page) cls+=" done"; if (i+1===state.page) cls+=" active";
    return `<div class="${cls}"></div>`;
  }).join("");
}

function render(){
  renderSteps();
  const p = document.getElementById("page");
  if (state.page===1) p.innerHTML = pageMajor();
  else if (state.page===2) p.innerHTML = pageStatus();
  else if (state.page===3) p.innerHTML = pageGrades();
  else p.innerHTML = pageResults();
}

function pageMajor(){
  const opt = (v,l)=>`<label class="radio"><input type="radio" name="major" value="${v}" ${state.major===v?"checked":""}>${l}</label>`;
  return `<div class="qlabel">Which major are you applying to?</div>
    ${opt("econ","Economics (B.A.)")}
    ${opt("econ_acct","Economics &amp; Accounting (B.A.)")}
    <div class="hint">Economics counts ECON 1, 2, and 10A toward the 2.85 GPA. Economics &amp; Accounting also counts ECON 3A and 3B.</div>
    <div class="navrow"><span></span>
      <button class="btn-nav" onclick="next1()">Next &rarr;</button></div>`;
}
function next1(){
  const sel = document.querySelector('input[name="major"]:checked');
  state.major = sel ? sel.value : "econ";
  state.page = 2; render();
}

function pageStatus(){
  const courses = premajorCourses(state.major);
  const rows = courses.map(([code,u,ucsbOnly],i)=>{
    const prev = state.statuses[code] || "ucsb";
    const opts = STATUS_CHOICES.map(([v,l])=>`<option value="${v}" ${prev===v?"selected":""}>${l}</option>`).join("");
    return `<div class="course-row">
      <div><div class="course-name">${code}</div>${ucsbOnly?'<div class="hint">Must be taken at UCSB</div>':''}</div>
      <select id="status_${i}">${opts}</select></div>`;
  }).join("");
  return `<div class="qlabel">What is the status of each pre-major course?</div>
    <div class="hint" style="margin-bottom:10px">Only courses taken at a UC campus count toward the 2.85 GPA. Non-UC courses give credit but are excluded from the GPA.</div>
    ${rows}
    <div class="navrow">
      <button class="btn-back" onclick="state.page=1;render()">&larr; Back</button>
      <button class="btn-nav" onclick="next2()">Next &rarr;</button></div>`;
}
function next2(){
  const courses = premajorCourses(state.major);
  state.statuses = {};
  courses.forEach(([code],i)=>{ state.statuses[code] = document.getElementById("status_"+i).value; });
  state.page = 3; render();
}

function pageGrades(){
  const courses = premajorCourses(state.major);
  const completed = courses.filter(([c])=>COUNTS.includes(state.statuses[c])).map(([c])=>c);
  const gradeOpts = sel => LETTERS.map(g=>`<option value="${g}" ${sel===g?"selected":""}>${g}</option>`).join("");
  let body;
  if (completed.length===0){
    body = `<div class="hint">No completed UC courses to grade — enter grades here once you have them.</div>`;
  } else {
    body = completed.map((code,j)=>{
      const prev = state.grades[code] || "B";
      return `<div class="course-row"><div class="course-name">${code}</div>
        <select class="narrow" id="grade_${j}">${gradeOpts(prev)}</select></div>`;
    }).join("");
  }
  const e5 = state.econ5 || {};
  return `<div class="qlabel">Enter your grades for completed UC courses</div>
    ${body}
    <hr>
    <div class="qlabel">Optional: ECON 5 supplement</div>
    <div class="hint" style="margin-bottom:8px">If your designated pre-major GPA falls below 2.85, a first-attempt ECON 5 grade taken at a UC may be used to help you reach it — but only if it raises your GPA.</div>
    <label class="opt"><input type="checkbox" id="has_econ5" ${e5.on?"checked":""} onchange="document.getElementById('e5box').style.display=this.checked?'block':'none'"> I have a UC ECON 5 grade to include</label>
    <div id="e5box" style="display:${e5.on?'block':'none'}">
      <div class="course-row"><div class="course-name">ECON 5</div>
        <select class="narrow" id="econ5_grade">${gradeOpts(e5.grade||"A")}</select></div>
      <label class="opt"><input type="checkbox" id="econ5_first" ${e5.first!==false?"checked":""}> This is my first attempt at ECON 5</label>
    </div>
    <div class="navrow">
      <button class="btn-back" onclick="state.page=2;render()">&larr; Back</button>
      <button class="btn-nav" onclick="next3()">See my results &rarr;</button></div>`;
}
function next3(){
  const courses = premajorCourses(state.major);
  const completed = courses.filter(([c])=>COUNTS.includes(state.statuses[c])).map(([c])=>c);
  state.grades = {};
  completed.forEach((code,j)=>{ state.grades[code] = document.getElementById("grade_"+j).value; });
  const hasE5 = document.getElementById("has_econ5").checked;
  if (hasE5){
    state.econ5 = {on:true, grade:document.getElementById("econ5_grade").value,
                   first:document.getElementById("econ5_first").checked};
  } else state.econ5 = {on:false};

  const entries = {};
  courses.forEach(([code])=>{ entries[code] = {status:state.statuses[code], grade:state.grades[code]}; });
  const econ5arg = hasE5 ? {grade:state.econ5.grade, first:state.econ5.first} : null;
  state.result = evaluate(state.major, entries, econ5arg);
  state.page = 4; render();
}

function pageResults(){
  const r = state.result;
  let cards = "";
  cards += `<div class="result-card info">
    <div class="muted">Current pre-major GPA (UC courses with grades)</div>
    <div class="bignum">${fmt(r.current)}</div>
    ${r.metOnlyE5 ? `<div style="margin-top:8px">With your ECON 5 grade applied: <span class="pill">${fmt(r.eff)}</span></div>`:''}
  </div>`;

  if (r.met){
    cards += `<div class="result-card ok"><strong>&#9989; You currently meet the 2.85 pre-major GPA requirement.</strong>
      ${r.hasRemaining ? '<div class="muted" style="margin-top:6px">You still have remaining courses below — keep your grades up to stay above 2.85.</div>':''}</div>`;
  } else if (r.hasRemaining){
    if (r.impossible){
      cards += `<div class="result-card bad"><strong>Reaching 2.85 is not possible with your remaining courses alone.</strong>
        <div style="margin-top:8px">Even straight A's in ${r.remCodes.join(", ")} would not bring you to 2.85. Speak with the Economics Undergraduate Advising Office about the ECON 10A Retake Exam and other options.</div></div>`;
    } else {
      const e5 = r.reqLetterE5 !== null;
      cards += `<div class="result-card warn">
        <div>To reach a 2.85 pre-major GPA you need to average at least</div>
        <div style="margin:10px 0"><span class="pill">${r.reqLetter}</span>
          <span class="muted">&nbsp; (a ${r.reqAvg.toFixed(2)} grade-point average)</span></div>
        <div>across your remaining course(s): <strong>${r.remCodes.join(", ")}</strong>.</div>
        ${r.proj!==null ? `<div class="muted" style="margin-top:6px">That would put your pre-major GPA at about ${r.proj.toFixed(2)}.</div>`:''}
        ${e5 ? `<div style="margin-top:10px">With your ECON 5 grade applied, the requirement eases to an average of <span class="pill">${r.reqLetterE5}</span> <span class="muted">(${r.reqAvgE5.toFixed(2)} GPA).</span></div>`:''}
      </div>`;
    }
  } else {
    cards += `<div class="result-card bad"><strong>You do not currently meet the 2.85 pre-major GPA requirement,</strong> and there are no remaining pre-major courses recorded. Speak with the Economics Undergraduate Advising Office about the ECON 10A Retake Exam as another avenue for admission.</div>`;
  }

  if (r.warnings.length){
    cards += `<div class="result-card bad"><strong>Please note:</strong><ul>${r.warnings.map(w=>`<li>${w}</li>`).join("")}</ul></div>`;
  }
  if (r.notes.length){
    cards += `<div class="result-card info"><ul>${r.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`;
  }
  cards += `<div class="muted" style="margin-top:4px">If you fall short of 2.85, the Department offers an ECON 10A Retake Exam as another path to admission. Contact the Economics Undergraduate Advising Office (2121 North Hall) for details and to confirm any ECON 5 supplement.</div>`;

  return `<div class="qlabel">Your pre-major GPA results</div>${cards}
    <div class="navrow">
      <button class="btn-back" onclick="state.page=3;render()">&larr; Edit grades</button>
      <button class="btn-nav" onclick="restart()">Start over</button></div>`;
}
function restart(){ state.page=1; state.major="econ"; state.statuses={}; state.grades={}; state.econ5=null; state.result=null; render(); }

render();
</script>
</body>
</html>
